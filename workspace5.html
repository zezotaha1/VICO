<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Portal</title>
    <style>
        #main{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('./assets/images/workspace.jpg') no-repeat center center fixed;
            background-size: cover; /* Ensures the image covers the screen */
             /* Ensures the background covers the viewport height */
        
            h1 {
                text-align: center;
                margin-top: 20px;
                color: #fff;
                text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            }
            .workspace {
                margin: 10px;
                padding: 20px;
                background-color: rgba(255, 255, 255, 0.8);
                border: 1px solid #ccc;
                cursor: pointer;
                text-align: center;
                border-radius: 8px;
                width: 90%; /* Responsive width */
                max-width: 300px; /* Restrict maximum size */
                margin: 20px auto; /* Center elements */
                transition: background-color 0.3s;
            }
            .workspace:hover {
                background-color: rgba(255, 255, 255, 1);
            }
            #loginForm, #options {
                display: none;
                text-align: center;
                margin-top: 40px;
                background-color: rgba(255, 255, 255, 0.9);
                padding: 20px;
                border-radius: 8px;
                width: 90%; /* Responsive width */
                max-width: 400px; /* Restrict maximum size */
                margin: 20px auto;
            }
            input[type="email"], input[type="password"] {
                padding: 10px;
                margin: 10px 0;
                width: 90%; /* Responsive width */
                max-width: 250px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            button {
                padding: 10px 20px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            button:hover {
                background-color: #45a049;
            }
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- font awesome library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- section styles -->
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <header class="container-fluid py-3 d-flex justify-content-between align-items-center">
        <section id="header-left">
          <img src="./assets/images/logo.png" alt="" />
        </section>
        <section id="header-mid">
          <ul class="p-0 m-0 d-flex gap-4">
            <li><a href="/#home">Home</a></li>
            <li><a href="/#companies" id="companies-link">Companies</a></li>
            <li><a href="/#about">About Us</a></li>
            <li><a href="/#testimonial" id="testimoinal-link">Testimonials</a></li>
            <li><a href="/#contact" id="contact-link">Contact Us</a></li>
          </ul>
        </section>
        <section id="header-righy">
         <!-- Profile and Cart Icons will be dynamically added if the user cookie exists -->
        <div id="authButtons">
          <a href="./signup.html">
            <button class="btn secondary-btn text-light">Sign-In</button>
          </a>
          <a href="./login.html">
            <button class="btn main-btn text-light">Login</button>
          </a>
        </div>
        <div id="userIcons" class="d-none">
          <!-- These icons will show if the user is logged in -->
          <a href="./profile.html" id="profile-icon" style="font-size: 30px; margin: 15px;">
            <i class="fas fa-user-circle text-light"></i>
          </a>
          <a href="./#cart" id="cart-icon" style="font-size: 30px; margin: 15px;">
            <i class="fas fa-shopping-cart text-light"></i>
          </a>
          <a href="/login.html" id="logout-icon" style="font-size: 30px; margin: 15px;" onclick="logout()">
            <i class="fas fa-sign-out-alt text-light"></i>
          </a>
        </div>
        </section>
      </header>
    <section id ="main">
        <h1>Choose Your Workspace</h1>
        
        <div class="workspace" onclick="openWorkspace('HR')">HR Team</div>
        <div class="workspace" onclick="openWorkspace('Sales')">Sales Team</div>
    <div class="workspace" onclick="openWorkspace('Managers')">Managers Team</div>
    <div class="workspace" onclick="openWorkspace('Developers')">Developers Team</div>

    <div id="loginForm">
        <h3 id="workspaceTitle">Login to Workspace</h3>
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <button onclick="authenticate()">Login</button>
    </div>

    <div id="options">
        <h3>Choose an Action</h3>
        <button onclick="startChat()">Chat</button>
        <button onclick="startMeeting()">Meet</button>
    </div>
    </section>
    <!-- footer -->
  <footer id="footer">
    <div class="card text-center" style="background-color: #031b35 ; color:whitesmoke">
      <div class="card-header" style="font-size: 30px;">
        VIRCO
      </div>
      <div class="card-body">
        <h5 class="card-title text-muted">OUR FAMOUS SITES</h5>
        <div class="card-text">
          <i class="fab fa-facebook-square"></i><i class="fab fa-google-plus"></i><i class="fab fa-whatsapp"></i><i
            class="fab fa-youtube"></i>
        </div>
        <a href="#" class="btn btn-success">Contact Us</a>
      </div>
      <div class="card-footer text-muted">
        © Copyright 2024 All Rights Reserved:
      </div>
  </footer>
  <!-- footer end -->
    <script>
        let workspace = '';

        function openWorkspace(workspaceName) {
            workspace = workspaceName;
            document.getElementById('workspaceTitle').innerText = `Login to ${workspaceName} Workspace`;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('options').style.display = 'none';
        }

        function authenticate() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            if (!validateEmail(email)) {
                alert('Please enter a valid email address.');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }

            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('options').style.display = 'block';
        }

        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function fakeApiCall(endpoint) {
            // Simulating a fake API call
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve({
                        status: 200,
                        message: `Successfully connected to the ${endpoint} endpoint for the ${workspace} team.`,
                        redirectUrl: endpoint === 'chat' ? 'https://example.com/chat' : 'https://example.com/meet',
                    });
                }, 1000); // Simulates a 1-second delay
            });
        }

        async function startChat() {
            try {
                const response = await fakeApiCall('chat');
                if (response.status === 200) {
                    alert(response.message);
                    window.location.href = response.redirectUrl; // Redirects to the chat URL
                }
            } catch (error) {
                alert('Failed to start chat. Please try again later.');
            }
        }

        async function startMeeting() {
            try {
                const response = await fakeApiCall('meet');
                if (response.status === 200) {
                    alert(response.message);
                    window.location.href = response.redirectUrl; // Redirects to the meeting URL
                }
            } catch (error) {
                alert('Failed to start meeting. Please try again later.');
            }
        }
    </script>
    <script src="./scripts/app.js"></script>
</body>
</html>
