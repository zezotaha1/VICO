<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Companies</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        .company-list { margin-top: 20px; }
        .company-card { margin-bottom: 10px; cursor: pointer; }
        .action-btns { margin-top: 10px; }
        .product-list { margin-top: 10px; }
        .product-item { margin-bottom: 5px; }
        .no-products { color: grey; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="my-4">My Virtual Companies</h1>
        <div class="row company-list">
            <!-- Company Cards will be dynamically inserted here -->
        </div>

        <!-- Modal for Co-founder and Product actions -->
        <div class="modal fade" id="companyModal" tabindex="-1" aria-labelledby="companyModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="companyModalLabel">Manage Company</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <h6>Co-founder Actions</h6>
                        <div class="action-btns">
                            <button id="addCofounder" class="btn btn-primary w-100">Add Co-founder</button>
                            <button id="deleteCofounder" class="btn btn-danger w-100 mt-2">Delete Co-founder</button>
                        </div>
                        <hr>
                        <h6>Product Actions</h6>
                        <div class="product-list">
                            <!-- Product list will be dynamically inserted here -->
                        </div>
                        <div class="action-btns mt-3">
                            <button id="addProduct" class="btn btn-success w-100">Add Product</button>
                            <button id="deleteProduct" class="btn btn-danger w-100 mt-2">Delete Product</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap and custom scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sample companies data
        const companies = [
            { id: 1, name: "Tech Innovators", cofounder: "John Doe", products: ["Product A", "Product B"] },
            { id: 2, name: "Design Studio", cofounder: "Jane Smith", products: ["Product X"] },
            { id: 3, name: "Creative Labs", cofounder: "Alice Johnson", products: ["Product M", "Product N", "Product O"] }
        ];

        // Function to render the companies list
        function renderCompanies() {
            const companyListDiv = document.querySelector('.company-list');
            companyListDiv.innerHTML = '';

            companies.forEach(company => {
                const companyCard = document.createElement('div');
                companyCard.classList.add('col-md-4');
                companyCard.classList.add('company-card');
                companyCard.innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">${company.name}</h5>
                            <p class="card-text">Co-founder: ${company.cofounder}</p>
                            <button class="btn btn-info" onclick="showCompanyActions(${company.id})">Manage</button>
                        </div>
                    </div>
                `;
                companyListDiv.appendChild(companyCard);
            });
        }

        // Show modal to manage company (co-founder and products)
        function showCompanyActions(companyId) {
            const company = companies.find(c => c.id === companyId);

            // Set up modal actions for the selected company
            document.getElementById('addCofounder').onclick = () => addCofounder(companyId);
            document.getElementById('deleteCofounder').onclick = () => deleteCofounder(companyId);
            document.getElementById('addProduct').onclick = () => addProduct(companyId);
            document.getElementById('deleteProduct').onclick = () => deleteProduct(companyId);

            // Render products in the modal
            const productListDiv = document.querySelector('.product-list');
            productListDiv.innerHTML = '';

            if (company.products.length === 0) {
                productListDiv.innerHTML = '<p class="no-products">No products available</p>';
            } else {
                company.products.forEach((product, index) => {
                    const productItem = document.createElement('div');
                    productItem.classList.add('product-item');
                    productItem.textContent = product;
                    productListDiv.appendChild(productItem);
                });
            }

            // Show modal
            const myModal = new bootstrap.Modal(document.getElementById('companyModal'));
            myModal.show();
        }

        // Add a co-founder
        function addCofounder(companyId) {
            const newCofounder = prompt("Enter the name of the new co-founder:");
            if (newCofounder) {
                const company = companies.find(c => c.id === companyId);
                company.cofounder = newCofounder;
                renderCompanies();
                const myModal = bootstrap.Modal.getInstance(document.getElementById('companyModal'));
                myModal.hide();
            }
        }

        // Delete the co-founder
        function deleteCofounder(companyId) {
            const company = companies.find(c => c.id === companyId);
            if (confirm(Are you sure you want to delete the co-founder for ${company.name}?)) {
                company.cofounder = "None";
                renderCompanies();
                const myModal = bootstrap.Modal.getInstance(document.getElementById('companyModal'));
                myModal.hide();
            }
        }

        // Add a product
        function addProduct(companyId) {
            const newProduct = prompt("Enter the name of the new product:");
            if (newProduct) {
                const company = companies.find(c => c.id === companyId);
                company.products.push(newProduct);
                renderCompanies();
                const myModal = bootstrap.Modal.getInstance(document.getElementById('companyModal'));
                myModal.hide();
            }
        }

        // Delete a product
        function deleteProduct(companyId) {
            const company = companies.find(c => c.id === companyId);
            const productToDelete = prompt("Enter the product name to delete:");
            const productIndex = company.products.indexOf(productToDelete);
            if (productIndex !== -1 && confirm(Are you sure you want to delete the product ${productToDelete}?)) {
                company.products.splice(productIndex, 1);
                renderCompanies();
                const myModal = bootstrap.Modal.getInstance(document.getElementById('companyModal'));
                myModal.hide();
            } else {
                alert("Product not found!");
            }
        }

        // Initial render
        renderCompanies();
    </script>
</body>
</html>
