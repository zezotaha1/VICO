<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles/systemAdmin.css">
    <!-- font awesome library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- section styles -->
    <link rel="stylesheet" href="./styles/main.css">
</head>
    
<body>
    <header class="container-fluid py-3 d-flex justify-content-between align-items-center">
    <section id="header-left">
      <img src="./assets/images/logo.png" alt="" />
    </section>
    <section id="header-mid">
      <ul class="p-0 m-0 d-flex gap-4">
        <li><a href="/#home">Home</a></li>
        <li><a href="/#companies" id="companies-link">Companies</a></li>
        <li><a href="/#about">About Us</a></li>
        <li><a href="/#testimonial" id="testimoinal-link">Testimonials</a></li>
        <li><a href="/#contact" id="contact-link">Contact Us</a></li>
      </ul>
    </section>
    <section id="header-righy">
     <!-- Profile and Cart Icons will be dynamically added if the user cookie exists -->
    <div id="authButtons">
      <a href="./signup.html">
        <button class="btn secondary-btn text-light">Sign-In</button>
      </a>
      <a href="./login.html">
        <button class="btn main-btn text-light">Login</button>
      </a>
    </div>
    <div id="userIcons" class="d-none">
      <!-- These icons will show if the user is logged in -->
      <a href="./profile.html" id="profile-icon" style="font-size: 30px; margin: 15px;">
        <i class="fas fa-user-circle text-light"></i>
      </a>
      <a href="./#cart" id="cart-icon" style="font-size: 30px; margin: 15px;">
        <i class="fas fa-shopping-cart text-light"></i>
      </a>
      <a href="/login.html" id="logout-icon" style="font-size: 30px; margin: 15px;" onclick="logout()">
        <i class="fas fa-sign-out-alt text-light"></i>
      </a>
    </div>
    </section>
  </header>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar m-0" id="sidebar">
                <a href="admin.html" style="text-decoration: none; color: black;">
                    <h3>Dashborad</h3>
                </a>
                <div class="sidebar-sticky">
                    <a href="CompaniesView.html"><i class='bx bx-buildings'></i>Companies</a>
                    <a href=""><i class='bx bx-add-to-queue'></i>Add New Company</a>
                    <a href="companyManage.html"><i class="bx bx-list-check"></i>Manage Companies</a>
                    <a href="#"><i class='bx bx-group'></i>Accounts Overview</a>
                    <a href="#"><i class='bx bxs-notification'></i>Notifications</a>
                </div>
            </nav>

            <!-- <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content"> -->
            <div class="content1 col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <br>
                
                <section class="company1 p-2">
                    <span style="font-size: xx-large; text-align: center; padding-left: 40%;">System Companies</span>
                    <table class="table table-striped">
                        <thead style="background-color:  rgb(20, 20, 20); color: white;">
                            <tr>
                                <th>Company Name</th>
                                <th>Owner</th>
                                <th>Establish Date</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="companies">
                            <script>
                                var xhr = new XMLHttpRequest();
                                xhr.open("get", "http://localhost:5500/data/companies.json")
                                xhr.onreadystatechange = function () {
                                    if (xhr.readyState == 4)
                                        if (xhr.status == 200) {
                                            var response = JSON.parse(xhr.responseText);
                                            const tableBody = document.querySelector('#companies');
                                            tableBody.innerHTML = '';
                                            console.log(response)
                                            for (var key of response) {
                                                const row = document.createElement('tr');
                                                row.innerHTML = `
                                               <td>${key.name}</td>
                            <td>${key.owner}</td>
                            <td>${key.establishedDate}</td>
                            <td>
                                <button class="btn btn-info btn-sm" onclick="deleteAccount('${key.id}')">Show</button>
                            </td>
                        `;
                                                tableBody.appendChild(row);
                                            }
                                        }
                                }
                                xhr.send();
        
                            </script>
                 
                        </tbody>
                    </table>
                    <br>
                    <br>
            </div>
        </section>
        </div>
    </div>
    <footer class="text-center bg-dark text-white py-3">
        &copy; 2024 Virtual Companies Platform. All rights reserved.
    </footer>

    <script src="./scripts/app.js"></script>
     <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
